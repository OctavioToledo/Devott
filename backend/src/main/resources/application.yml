spring:
  application:
    name: devott-api
  config:
    # En local, carga backend/.env si existe. En producción se usan variables de entorno.
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devott}
    username: ${SPRING_DATASOURCE_USERNAME:devott}
    password: ${SPRING_DATASOURCE_PASSWORD:devott}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo verifica que coincida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  http:
    clients:
      # Para servicios externos (Georef): mejor fallar rápido que colgar el request.
      connect-timeout: 3s
      read-timeout: 5s
  cache:
    cache-names: localidades
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=7d
  web:
    # Mensajes de validación siempre en español, sin importar el Accept-Language.
    locale: es_AR
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}

devott:
  api:
    version: v1
  # URL pública de esta API (para armar las URLs del almacenamiento local).
  api-url: ${API_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  supabase:
    # Por defecto apunta a Supabase local (supabase start). Las claves se piden recién al validar un token.
    url: ${SUPABASE_URL:http://localhost:54321}
    jwt-issuer: ${SUPABASE_JWT_ISSUER:${devott.supabase.url}/auth/v1}
    # Clave secreta (sb_secret_...) para firmar subidas a Storage. Nunca va al frontend.
    secret-key: ${SUPABASE_SECRET_KEY:}
  almacenamiento:
    # local: directorio del backend (desarrollo). supabase: Supabase Storage.
    tipo: ${ALMACENAMIENTO:local}
    bucket: ${SUPABASE_BUCKET:fotos}
    local:
      directorio: ${ALMACENAMIENTO_LOCAL_DIR:./almacenamiento-local}
  # Emails con acceso a la administración (planes y suscripciones), separados por coma.
  admins: ${DEVOTT_ADMINS:}
  suscripciones:
    # Todos los días: vence las suscripciones pasada la gracia y pausa sus publicaciones.
    vencimiento-cron: ${DEVOTT_VENCIMIENTO_CRON:0 15 3 * * *}
  cotizaciones:
    url: ${DOLARAPI_URL:https://dolarapi.com}
    # Cada 3 horas, hora argentina. "-" desactiva la actualización periódica.
    cron: ${DEVOTT_COTIZACIONES_CRON:0 0 */3 * * *}
    al-iniciar: ${DEVOTT_COTIZACIONES_AL_INICIAR:true}
  georef:
    # API pública de localidades del Gobierno argentino: https://apis.datos.gob.ar/georef
    url: ${GEOREF_URL:https://apis.datos.gob.ar/georef/api}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # /actuator/health/liveness y /actuator/health/readiness para los chequeos del deploy.
      probes:
        enabled: true
